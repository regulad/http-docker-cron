name: Docker

# Publishes ghcr.io/regulad/http-docker-cron: latest from master, which the doppelganger stack runs, a tag for each
# v*.*.* release, the branch name, and a dated tag from each nightly rebuild, so the image picks up its Alpine branch's
# fixes when nothing is pushed. Pull requests don't build here: workflows/ci.yml builds and tests the image on them.
on:
  workflow_dispatch:
  schedule:
    - cron: "26 19 * * *"
  push:
    branches: ["master"]
    tags: ["v*.*.*"]

jobs:
  # docker/github-builder handles checkout (via a BuildKit git context), buildx, registry login, metadata, native
  # per-platform builds (arm64 on GitHub's arm64 runners, no QEMU), manifest-list merging, and signing.
  # https://github.com/docker/github-builder
  #
  # Building from the git tree means BuildKit skips .dockerignore, which this repository doesn't have.
  #
  # amd64 is plain linux/amd64, not linux/amd64/v3: the image compiles nothing, and Alpine publishes no v3 variant of
  # its base image or its packages.
  #
  # note: env context isn't available inside a reusable workflow call's with:/secrets: blocks, so
  # ghcr.io/${{ github.repository }} is inlined rather than pulled from a top-level env: block.
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: docker/github-builder/.github/workflows/build.yml@bb1eb9fb69408ac52395fb21f49c6b52d564529a # v1.20.0
    with:
      output: image
      push: true
      context: "."
      file: "./Dockerfile"
      platforms: linux/amd64,linux/arm64
      # Both architectures are required for the final manifest.
      fail-fast: true
      cache: true
      cache-scope: http-docker-cron
      cache-mode: max
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: |
        latest=false
      meta-tags: |
        type=raw,value=latest,enable={{is_default_branch}}
        type=ref,event=branch
        type=ref,event=tag
        type=schedule,pattern={{date 'YYYYMMDD'}}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
