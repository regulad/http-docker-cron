name: CI

# Checks every pull request into master: the image, built natively on each architecture, and tests/smoke.sh run against
# it. master requires these checks (.github/settings.yml), which is what lets dependabot-auto-merge.yml merge
# Dependabot's PRs: a merge to master publishes the :latest that the doppelganger stack runs.
#
# Nothing here uses a secret, so it runs the same on Dependabot's PRs, which only see Dependabot secrets.
on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read

# A new push to a PR replaces the checks still running for its previous commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Loaded into the runner's Docker for the smoke test, with the build cache kept per architecture.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: http-docker-cron:ci
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=ci-${{ matrix.runner }}
          cache-to: type=gha,scope=ci-${{ matrix.runner }},mode=max
      # The crontab entrypoint.sh writes, with TLS verification off and on, and one real request on cron's schedule.
      - name: Smoke-test the image
        run: sh tests/smoke.sh http-docker-cron:ci
