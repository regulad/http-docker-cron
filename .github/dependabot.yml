# Dependabot keeps every pinned version current: the image's base image (Dockerfile) and GitHub Actions.
#
# Each ecosystem gets one PR a week grouping its minor and patch updates. workflows/dependabot-auto-merge.yml has GitHub
# merge the base image's patch updates, and security updates, once CI's image checks pass. A merge to master publishes
# the image as ghcr.io/regulad/http-docker-cron:latest, which the doppelganger stack runs. These wait for a person:
# - the base image's minor updates, each a new Alpine release branch (the workflow says why);
# - the actions group, since workflow changes get a review;
# - major updates, which come as PRs of their own.
#
# The cooldown holds each release back until it is two weeks old, so nothing ships while it's days old. Security
# updates skip it.
version: 2

updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      docker:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: ["minor", "patch"]
